name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          python -m venv work/build-env
          work/build-env/Scripts/python.exe -m pip install -r requirements-dev.txt
          npm ci

      - name: Lint
        run: work/build-env/Scripts/python.exe -m ruff check .

      - name: Python tests
        run: work/build-env/Scripts/python.exe -m unittest discover -s tests -t . -v

      - name: Web UI tests
        run: npm test

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build, self-test and package
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: lantern-deck-windows
          path: |
            outputs/Lantern-Deck-*-Portable.zip
            outputs/Lantern-Deck-*-Setup.exe
            outputs/SHA256SUMS-*.txt
            work/binary-smoke.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lantern-deck-windows
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            outputs/Lantern-Deck-*-Portable.zip
            outputs/Lantern-Deck-*-Setup.exe
            outputs/SHA256SUMS-*.txt
